# Quad — Minimal Configuration for BTCUSDT USDT-Perpetual Bot (OKX)
_mode: "okx"
_dry_run: true

trading:
  # One trade per cycle: force-close every open position before a new ENTER.
  # Only one position may ever be open (see also ai.rotation below).
  serial_trade_mode: true
  default_strategy: "trend_following"
  ai_cycle_interval: 3600
  underlyings:
    - "BTC-USDT-SWAP"
    - "ETH-USDT-SWAP"
    - "SOL-USDT-SWAP"
    - "BNB-USDT-SWAP"
  leverage: 50
  margin_mode: "isolated"
  position_mode: "one_way"

exchange:
  name: "okx"
  testnet: true

risk:
  max_positions: 1
  max_leverage: 50
  # Leverage-aware liquidation guard: the effective threshold is
  # min(min_distance_to_liquidation_pct, liquidation_distance_fraction / leverage).
  # At 50x isolated, liquidation sits ~2% from entry, so a flat 20% would
  # always trip. 0.5 / 50 = 1% -> warn/block only when genuinely close.
  min_distance_to_liquidation_pct: 0.20
  liquidation_distance_fraction: 0.5
  per_position_sl:
    enabled: true
    type: "fixed"
    capital_pct: 30.0
  per_position_tp:
    enabled: true
    type: "fixed"
    capital_pct: 50.0

execution:
  reconcile_interval_seconds: 60

persistence:
  dsn: "data/quad.db"

telegram:
  enabled: true
  job_intervals:
    status_summary_seconds: 3600
    risk_alert_seconds: 300

ai:
  enabled: true
  model: "groq/compound-mini"
  pairs:
    - "BTC-USDT-SWAP"
    - "ETH-USDT-SWAP"
    - "SOL-USDT-SWAP"
    - "BNB-USDT-SWAP"
  timeframes:
    - "1h"
  candle_count: 150
  max_tokens: 4096
  prompt:
    max_candles: 20
  rotation:
    enabled: true
    retry_sleep_seconds: 30
    close_positions_on_start: true
    close_open_position_each_cycle: true
    max_hold_seconds: 21600
    price_bracket_check: true
    price_bracket_tolerance_pct: 0.5
  groq:
    token_budget:
      enabled: false
  validator:
    gate_mode: "warn"
    min_confidence_to_trade: 0.0
  metrics:
    enabled: true
    interval_cycles: 1
    min_resolved: 5
    only_directional: true

monitoring:
  health_server:
    port: 9090
    bind_address: "127.0.0.1"
    version: "0.1.0"

strategy:
  trend_following:
    enabled: true
    fast_ema: 9
    slow_ema: 21
    adx_threshold: 25
    trade_capital_usd: 5

retrain:
  enabled: true
  interval_days: 7
