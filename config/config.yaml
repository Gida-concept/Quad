# Quad — Minimal Configuration for BTCUSDT Futures Bot
_mode: "binance"
_dry_run: true

trading:
  serial_trade_mode: false
  default_strategy: "trend_following"
  ai_cycle_interval: 3600
  underlyings:
    - "BTCUSDT"
    - "ETHUSDT"
    - "SOLUSDT"
    - "BNBUSDT"
  leverage: 50
  margin_mode: "isolated"
  position_mode: "one_way"

exchange:
  name: "binance"
  testnet: true

risk:
  max_positions: 1
  max_leverage: 50
  per_position_sl:
    enabled: true
    type: "fixed"
    capital_pct: 30.0
  per_position_tp:
    enabled: true
    type: "fixed"
    capital_pct: 50.0

execution:
  reconcile_interval_seconds: 60

persistence:
  dsn: "data/quad.db"

telegram:
  enabled: true
  job_intervals:
    status_summary_seconds: 3600
    risk_alert_seconds: 300

ai:
  enabled: true
  model: "llama-3.1-8b-instant"
  pairs:
    - "BTCUSDT"
    - "ETHUSDT"
    - "SOLUSDT"
    - "BNBUSDT"
  timeframes:
    - "1h"
  candle_count: 150
  max_tokens: 4096
  prompt:
    max_candles: 20
  rotation:
    enabled: true
    retry_sleep_seconds: 30
  groq:
    token_budget:
      enabled: true
      max_tokens_per_day: 500000
      window_seconds: 86400
  validator:
    gate_mode: "warn"
    min_confidence_to_trade: 0.0
  metrics:
    enabled: true
    interval_cycles: 1
    min_resolved: 5
    only_directional: true

monitoring:
  health_server:
    port: 9090
    bind_address: "0.0.0.0"
    version: "0.1.0"

strategy:
  trend_following:
    enabled: true
    fast_ema: 9
    slow_ema: 21
    adx_threshold: 25
    trade_capital_usd: 5

retrain:
  enabled: true
  interval_days: 7
