# =============================================================================
# Docker Compose — Quad USD-M Futures Trading Bot
#
# Multi-service deployment with Tailscale sidecar for VPN routing.
# The quad container shares Tailscale's userspace network namespace to
# route Bybit API traffic through a non-US exit node — no NET_ADMIN
# capability required inside the quad container itself.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Tailscale Sidecar — Userspace networking VPN
  # ---------------------------------------------------------------------------
  # Runs Tailscale in userspace networking mode (--tun=userspace-networking),
  # which requires no NET_ADMIN capability.  The quad service uses
  # network_mode: "service:tailscale" to share this network namespace,
  # so ALL outbound traffic (REST API, WebSockets) goes through Tailscale.
  # BYBIT_API_* requests will appear to originate from the exit node's IP.
  tailscale:
    image: tailscale/tailscale:${TAILSCALE_IMAGE_TAG:-stable}
    container_name: quad-tailscale
    restart: unless-stopped

    # Tailscale needs to read/write state and the tun device.  Since we use
    # userspace mode, no NET_ADMIN cap is required — just a tmpfs for the
    # socket and state directory.
    cap_add:
      - NET_BIND_SERVICE    # allow binding to port 80/443 if needed
    environment:
      # --- Tailscale Auth (REQUIRED) ---
      # Get your auth key from https://login.tailscale.com/admin/acls/keys
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - TS_ADVERTISE_EXIT_NODE=${TS_ADVERTISE_EXIT_NODE:-false}
      - TS_STATE_DIR=${TS_STATE_DIR:-/var/lib/tailscale}
      - TS_USERSPACE_ONLY=${TS_USERSPACE_ONLY:-true}
      - TS_NO_LOGS_NO_DIRS=${TS_NO_LOGS_NO_DIRS:-true}
      # Set the exit node to route traffic through (must be a non-US node)
      - TS_EXIT_NODE=${TS_EXIT_NODE_IP:-}
      # Optional: restrict to specific tailnet users
      - TS_TAILNET=${TS_TAILNET:-}
      - TZ=UTC
    volumes:
      - tailscale_state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    # Userspace mode — no NET_ADMIN needed for the main app
    command: ["--state=/var/lib/tailscale/tailscaled.state", "--tun=userspace-networking"]

    # Healthcheck: verify tailscale is running
    healthcheck:
      test: ["CMD", "tailscale", "ip", "-4"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ---------------------------------------------------------------------------
  # Quad Bot — Shares Tailscale network namespace
  # ---------------------------------------------------------------------------
  quad:
    build:
      context: .
      dockerfile: Dockerfile
    image: quad:latest
    container_name: quad-bot
    restart: unless-stopped

    # Share Tailscale's network namespace — all traffic routes through VPN
    network_mode: "service:tailscale"

    volumes:
      # Read-only config mount
      - ./config:/app/config:ro
      # Persistent data (SQLite database)
      - quad_data:/app/data
      # Log output directory
      - quad_logs:/app/logs

    environment:
      # --- Operation Mode ---
      - QUAD_MODE=${QUAD_MODE:-bybit}
      - QUAD_DRY_RUN=${QUAD_DRY_RUN:-true}
      - QUAD_LOG_LEVEL=${QUAD_LOG_LEVEL:-INFO}
      - QUAD_LOG_FORMAT=${QUAD_LOG_FORMAT:-json}
      - QUAD_DEFAULT_STRATEGY=${QUAD_DEFAULT_STRATEGY:-trend_following}
      - QUAD_CONFIG_DIR=/app/config
      - QUAD_HEALTH_PORT=${QUAD_HEALTH_PORT:-9090}

      # --- Bybit API (REQUIRED) — USDT perpetual (category=linear) ---
      - BYBIT_API_KEY=${BYBIT_API_KEY:-}
      - BYBIT_API_SECRET=${BYBIT_API_SECRET:-}
      - BYBIT_TESTNET=${BYBIT_TESTNET:-true}

      # --- Telegram Bot (REQUIRED) ---
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN is required}
      - TELEGRAM_NOTIFICATION_CHAT_ID=${TELEGRAM_NOTIFICATION_CHAT_ID:-}

      # --- AI / Groq ---
      - GROQ_API_KEY=${GROQ_API_KEY:-}

      # --- Proxy (optional, falls back to Tailscale exit node) ---
      # Can be used in addition to or instead of Tailscale for specific
      # HTTP/WebSocket services that bypass the network namespace.
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1}

      # --- Timezone ---
      - TZ=UTC

    depends_on:
      tailscale:
        condition: service_healthy

    # Health check runs inside the Tailscale network namespace via localhost
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${QUAD_HEALTH_PORT:-9090}/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    stop_grace_period: 30s
    init: true

volumes:
  tailscale_state:
  quad_data:
  quad_logs:
